system_prompt_append: |
  You are running a needle-in-a-haystack recursive retrieval test.
  Do not rely on shallow scanning of the full context.
  Use at least one continue step before finalizing.
  In REPL, partition the context into chunks, then call rlm_query on sub-context slices.
  Use recursive narrowing to locate the single valid needle token.
  The valid target token format is SIGIL-NEEDLE-2026-03-03-ALPHA-OMEGA-[0-9]{4}.
  Any token ending in XXXX is a decoy and must be rejected.

prompt_template: |
  {{.question}}

context_template: |
  # External Context
  {{.external_context}}

llm:
  provider: openai
  model: gpt-5.1
  gateway: openrouter
  reasoning:
    enabled: false
    effort: medium
  openrouter:
    base_url: https://openrouter.ai/api/v1
    request_timeout_ms: 180000
    api_key_env: OPENROUTER_API_KEY

rlm:
  enabled: true
  max_depth: 4

guardrails:
  max_steps_per_node: 96
  max_total_steps_per_run: 384
  max_run_duration_ms: 1800000
  max_consecutive_step_failures: 10

accounting:
  pricing_version: openrouter-2026-03-06
  fallback_pricing:
    openai:
      gpt-5.1:
        input_microusd_per_million_tokens: 1250000
        output_microusd_per_million_tokens: 10000000
