name: templated

prompt_template: |
  {{.question}}

context_template: |
  # External Context
  {{.external_context}}

llm:
  provider: openai
  model: gpt-5.3-codex
  gateway: openrouter
  reasoning:
    enabled: false
    effort: medium
  openrouter:
    base_url: https://openrouter.ai/api/v1
    request_timeout_ms: 180000
    api_key_env: OPENROUTER_API_KEY

rlm:
  enabled: true
  max_depth: 3

guardrails:
  max_steps_per_node: 96
  max_total_steps_per_run: 384
  max_run_duration_ms: 1800000
  max_consecutive_step_failures: 10
  max_total_tokens: 1000000
  max_total_cost_usd: "5"

accounting:
  pricing_version: openrouter-2026-03-07
  fallback_pricing:
    openai:
      gpt-5.3-codex:
        input_microusd_per_million_tokens: 1750000
        output_microusd_per_million_tokens: 14000000
